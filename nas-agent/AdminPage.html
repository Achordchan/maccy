<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maccy 管理后台</title>
<style>
body{font-family:Segoe UI,system-ui,sans-serif;background:#0b1220;color:#edf2ff;margin:0;padding:24px}
h1,h2{margin:0 0 12px}
.wrap{max-width:1100px;margin:0 auto}
.card{background:#121c32;border:1px solid #26324f;border-radius:16px;padding:16px;margin:0 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,button{padding:10px 12px;border-radius:10px;border:1px solid #33446a;background:#0d1528;color:#edf2ff}
button{background:#4f7cff;border:none;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #26324f;text-align:left;font-size:14px}
.muted{color:#91a0c1}
.toast{position:fixed;right:16px;bottom:16px;background:#101827;border:1px solid #33446a;padding:10px 14px;border-radius:10px;opacity:0;transition:.2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Maccy 管理后台</h1>

  <div class="card">
    <h2>生成卡密</h2>
    <div class="row">
      <input id="cardCount" type="number" value="1" min="1" max="100" style="width:90px">
      <input id="cardDays" type="number" value="30" min="1" max="3650" style="width:120px">
      <button onclick="generateCards()">生成</button>
    </div>
    <div id="cardResult" class="muted" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>升级订阅</h2>
    <div class="row">
      <input id="upgradeTarget" placeholder="邮箱或用户ID" style="width:280px">
      <input id="upgradeDays" type="number" value="30" min="1" max="3650" style="width:120px">
      <button onclick="upgradeUser()">升级</button>
    </div>
  </div>

  <div class="card">
    <h2>用户</h2>
    <div id="usersTable" class="muted">加载中...</div>
  </div>

  <div class="card">
    <h2>订阅</h2>
    <div id="subscriptionsTable" class="muted">加载中...</div>
  </div>

  <div class="card">
    <h2>卡密</h2>
    <div id="cardsTable" class="muted">加载中...</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const KEY = "maccy_admin_key";

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2600);
}

function adminKey() {
  const saved = (localStorage.getItem(KEY) || "").trim();
  if (saved) return saved;
  const typed = (prompt("请输入管理密钥") || "").trim();
  if (typed) localStorage.setItem(KEY, typed);
  return typed;
}

function headers() {
  const key = adminKey();
  if (!key) {
    toast("缺少管理密钥");
    return null;
  }
  return { Authorization: "Bearer " + key, "Content-Type": "application/json" };
}

async function read(res) {
  try { return await res.json(); } catch { return {}; }
}

function resetAdminKey() {
  localStorage.removeItem(KEY);
}

async function generateCards() {
  const h = headers();
  if (!h) return;
  const count = parseInt(document.getElementById("cardCount").value) || 1;
  const durationDays = parseInt(document.getElementById("cardDays").value) || 30;
  const res = await fetch("/admin/card/generate", {
    method: "POST",
    headers: h,
    body: JSON.stringify({ count, durationDays })
  });
  const data = await read(res);
  if (res.status === 401) {
    resetAdminKey();
    toast("管理密钥错误");
    return;
  }
  if (!res.ok) {
    toast(data.error || "请求失败");
    return;
  }
  document.getElementById("cardResult").innerHTML = (data.codes || []).map(x => "<div><code>" + x + "</code></div>").join("");
  loadCards();
  toast("卡密生成成功");
}

async function upgradeUser() {
  const h = headers();
  if (!h) return;
  const emailOrUserId = document.getElementById("upgradeTarget").value.trim();
  const durationDays = parseInt(document.getElementById("upgradeDays").value) || 30;
  if (!emailOrUserId) {
    toast("缺少用户标识");
    return;
  }
  const res = await fetch("/admin/user/upgrade", {
    method: "POST",
    headers: h,
    body: JSON.stringify({ emailOrUserId, durationDays })
  });
  const data = await read(res);
  if (res.status === 401) {
    resetAdminKey();
    toast("管理密钥错误");
    return;
  }
  if (!res.ok) {
    toast(data.error || "请求失败");
    return;
  }
  loadUsers();
  loadSubscriptions();
  toast("订阅更新成功");
}

async function loadUsers() {
  const h = headers();
  if (!h) {
    document.getElementById("usersTable").innerHTML = "缺少管理密钥";
    return;
  }
  const res = await fetch("/admin/users/list", { headers: h });
  const data = await read(res);
  if (res.status === 401) {
    resetAdminKey();
    document.getElementById("usersTable").innerHTML = "管理密钥错误";
    return;
  }
  const list = data.users || [];
  document.getElementById("usersTable").innerHTML = list.length
    ? "<table><thead><tr><th>邮箱</th><th>用户ID</th><th>到期时间</th></tr></thead><tbody>" +
      list.map(u => "<tr><td>" + u.email + "</td><td><code>" + u.id + "</code></td><td>" + (u.expires_at ? new Date(u.expires_at).toLocaleString() : "-") + "</td></tr>").join("") +
      "</tbody></table>"
    : "暂无用户";
}

async function loadSubscriptions() {
  const h = headers();
  if (!h) {
    document.getElementById("subscriptionsTable").innerHTML = "缺少管理密钥";
    return;
  }
  const res = await fetch("/admin/subscriptions/list", { headers: h });
  const data = await read(res);
  if (res.status === 401) {
    resetAdminKey();
    document.getElementById("subscriptionsTable").innerHTML = "管理密钥错误";
    return;
  }
  const list = data.subscriptions || [];
  document.getElementById("subscriptionsTable").innerHTML = list.length
    ? "<table><thead><tr><th>邮箱</th><th>用户ID</th><th>到期时间</th></tr></thead><tbody>" +
      list.map(s => "<tr><td>" + (s.email || "-") + "</td><td><code>" + s.user_id + "</code></td><td>" + new Date(s.expires_at).toLocaleString() + "</td></tr>").join("") +
      "</tbody></table>"
    : "暂无订阅";
}

async function loadCards() {
  const h = headers();
  if (!h) {
    document.getElementById("cardsTable").innerHTML = "缺少管理密钥";
    return;
  }
  const res = await fetch("/admin/cards/list", { headers: h });
  const data = await read(res);
  if (res.status === 401) {
    resetAdminKey();
    document.getElementById("cardsTable").innerHTML = "管理密钥错误";
    return;
  }
  const list = data.cards || [];
  document.getElementById("cardsTable").innerHTML = list.length
    ? "<table><thead><tr><th>卡密</th><th>天数</th><th>使用者</th><th>使用时间</th></tr></thead><tbody>" +
      list.map(c => "<tr><td><code>" + c.code + "</code></td><td>" + c.duration_days + "</td><td>" + (c.used_by || "-") + "</td><td>" + (c.used_at ? new Date(c.used_at).toLocaleString() : "-") + "</td></tr>").join("") +
      "</tbody></table>"
    : "暂无卡密";
}

loadUsers();
loadSubscriptions();
loadCards();
</script>
</body>
</html>
