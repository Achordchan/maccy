services:
  maccy-nas-agent:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: maccy-nas-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:17655:17655"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:17655
      TZ: ${TZ}
      Storage__Root: /data
      Admin__Key: ${ADMIN_KEY}
      Auth__Issuer: ${AUTH_ISSUER}
      Auth__Audience: ${AUTH_AUDIENCE}
      Auth__SigningKey: ${AUTH_SIGNING_KEY}
    volumes:
      - ./data:/data
